schema_version: "1.0"
name: lookup-one-fact
description: A one-fact question about a local page is answered through slim's lookup tool instead of loading the page whole.
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Does ./page.html load the Feedhopper widget? Answer yes or no and give the script URL. Use the cheapest way to check one fact."
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Bash, Read, WebFetch, ToolSearch, mcp__slim__lookup]
graders:
  - name: used-lookup
    type: tool_used
    tool: mcp__slim__lookup
    min: 1
    arm: with-only
  - name: no-raw-page
    type: regex
    target: trace
    match: not_contains
    pattern: 'SENTINEL-STYLE-9Q'
    arm: both
  - name: judge
    type: llm
    focus: last_message
    arm: both
    criteria: "The answer says yes and gives https://cdn.feedhopper.io/widget.js."

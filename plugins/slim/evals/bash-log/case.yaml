schema_version: "1.0"
name: bash-log
description: A cat of a 2,000-line application log through Bash reaches the model through the log engine (deduped, stack trace kept).
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the Bash tool to run `cat app.log` and tell me which exception the log reports and what its message is."
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Bash]
graders:
  - name: used-bash
    type: tool_used
    tool: Bash
    min: 1
    arm: both
  - name: slim-evidence
    type: regex
    target: trace
    pattern: 'slim: compressed'
    arm: with-only
  - name: dedupe
    type: regex
    target: trace
    pattern: ' ×\d+'
    arm: with-only
  - name: judge
    type: llm
    focus: last_message
    arm: both
    criteria: "The answer names java.lang.IllegalStateException and the message 'inventory reservation expired'."

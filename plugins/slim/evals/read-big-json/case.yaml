schema_version: "1.0"
name: read-big-json
description: A Read of a ~190 KB JSON export reaches the model compressed, with a recovery handle, and the answer is still right.
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The file ./orders.json holds an export of orders. Read it with the Read tool and tell me how many orders it lists and when it was exported."
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Read]
graders:
  - name: used-read
    type: tool_used
    tool: Read
    min: 1
    arm: both
  - name: slim-evidence
    type: regex
    target: trace
    pattern: 'slim: compressed [\d,]+ B → [\d,]+ B|<<full='
    arm: with-only
  - name: sentinel-dropped
    type: regex
    target: trace
    match: not_contains
    pattern: 'SENTINEL-ORDER-0217'
    arm: with-only
  - name: judge
    type: llm
    focus: last_message
    arm: both
    criteria: "The answer says the file lists 240 orders and that it was exported at 2026-10-07T09:00:00Z (any clear rendering of that date and time). Pass only if both facts are stated and correct."
